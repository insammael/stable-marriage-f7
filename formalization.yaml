fidelity:
  divergences: >-
    Port changes are elaboration-level: module headers and public imports,
    legacy elaboration options (backward.isDefEq.respectTransparency false,
    backward.privateInPublic, one backward.proofsInPublic), simpa using! for
    the previous simpa closing behaviour, -failIfUnchanged on simp/dsimp,
    local instance alignments, and splitting five files above 10,000 lines.
    Seven legacy registry modules were adapted to a strengthened certificate
    type (BoundedValid, which implies Valid). Eight declarations that used
    native_decide and are not used by f7_eq_85 were removed, together with
    one module that held only such a declaration. This revision also removes
    an unused import branch, narrows imports, and simplifies proof terms for
    the graph certificates. Large dictionary keys use definitionally equal
    arithmetic expressions. Low-fee and mass-12 checks are split into
    smaller kernel checks. The single-G classification fixes the designated
    endpoints before enumerating cases. The budget-five proof checks short
    subtrees in the kernel and omits unused state certificates. The Q0
    certificate for tree 37 checks eight groups of leaves. The submitted
    theorem and the definitions of f are unchanged.

review:
  status: agent-reviewed
  notes: "Agent-assisted development, port and local from-scratch build checks; no independent human peer review is claimed. Palomar's automated editorial review is separate."

alignment:
