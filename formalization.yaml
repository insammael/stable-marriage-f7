status:
  scope: >-
    The single declaration selected by comparator.json,
    F7Manuscript.f7_eq_85 : f 7 = 85, is the registration claim. It has no
    hypotheses. The proof library has 7,503 modules. Challenge and Solution
    are the two additional entry points.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  notes: "Counts concern Solution and the proof development; Challenge contains one deliberate theorem statement hole. All mathematical definition values are specified. The proof library contains no native_decide."

