version: v0.4

project:
  name: "Order-seven stable matchings: lower bound 85 and supporting poset certificates"
  description: >-
    A companion formalization of Myunglae Jo's R2 stable-marriage preprint.
    The selected results prove the unconditional actual-profile lower bound
    f(7) >= 85 and the 85-ideal count of the displayed twenty-event order,
    with its order identified as successive-participation closure. They also
    prove finite-poset pair and deficit bounds under explicit forbidden-pattern
    hypotheses, ideal-antichain counting and selected size-dependent ideal
    bounds, fixed-token run capacities and seven-site saturation, and graph
    budget soundness under explicit simulation completeness. The universal
    actual-profile upper bound is not assembled in Lean; no unconditional
    end-to-end Lean proof of f(7)=85 is claimed.
  authors: ["Myunglae Jo"]
  responsible_maintainers: ["Myunglae Jo"]
  license: CC-BY-4.0

classification:
  arxiv: [math.CO]
  msc2020: [05C70, 06A07]

