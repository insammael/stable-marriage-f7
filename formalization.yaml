fidelity:
  divergences: >-
    This registration covers a companion subset, not the full f(7)=85
    manuscript conclusion. Semantic extraction of actual rotations and
    charts, the general triple ledger, equality exclusion, and complete
    actual finite-cover embeddings remain formal gaps. Conditional premises
    are retained, not replaced by axiom declarations or opaque certificates.

