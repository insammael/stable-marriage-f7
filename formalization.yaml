status:
  scope: >-
    The 36 declarations selected by comparator.json are the registration
    claims. Actual lower85 and the fixed event-poset count are unconditional.
    Poset, token-run, and graph results have their displayed hypotheses.
    The size21/delta3=6 ideal bound assumes equality exclusion. Additional
    modules provide supporting results but are not individually compared.
    The full actual-profile upper85 and hence unconditional f(7)=85 are
    not assembled in Lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  notes: "Counts concern Solution and the proof development; Challenge contains deliberate theorem statement holes. All mathematical definition values are specified."

