version: v0.4

project:
  name: "Order-seven stable matchings: f(7) = 85"
  description: >-
    A Lean 4 proof that the maximum number of stable perfect matchings of a
    strict complete 7-by-7 stable-marriage instance is 85. The compared
    theorem F7Manuscript.f7_eq_85 : f 7 = 85 has no hypotheses. Every finite
    case of the upper bound is a kernel-checked proof, with no custom axioms
    and no native execution.
  authors: ["Myunglae Jo"]
  responsible_maintainers: ["Myunglae Jo"]
  license: CC-BY-4.0

classification:
  arxiv: [math.CO]
  msc2020: [05C70, 06A07]

sources:
  - title: "A computer-assisted proof that the maximum number of stable matchings of order seven is 85"
    authors: ["Myunglae Jo"]
    id: "doi:10.5281/zenodo.23329599"
    location: "https://doi.org/10.5281/zenodo.23329599"
    type: paper
    relationship: formalizes
    license: CC-BY-4.0
    author_endorsement: participated
    note: >-
      R2, 13 October 2026. The registered theorem is the main theorem of R2.
      The Lean development starts from the R2 Lean companion and extends it
      with a later development (November 2026) that connects the actual
      upper-bound layers and replaces R2's separately certified finite
      checks by kernel-checked proofs. It formalizes the theorem, not the
      R2 text line by line.
  - title: "Small Rotation Blocks and the Order-Six Stable Marriage Problem"
    authors: ["Myunglae Jo"]
    type: paper
    relationship: background
    location: "https://zenodo.org/records/22909380"
    author_endorsement: participated
    note: >-
      The predecessor work proves f(6)=48. Its fixed-token and convex-block
      mathematics is background to the token-capacity results. The
      identified version 09 manuscript and supplement are preserved in
      supplementary note S19 of the R2 order-seven distribution.
  - title: "College admissions and the stability of marriage"
    authors: ["David Gale", "Lloyd S. Shapley"]
    id: "doi:10.1080/00029890.1962.11989827"
    type: paper
    relationship: background
    author_endorsement: not-contacted
    note: "American Mathematical Monthly 69 (1962), 9–15; the ordinary stability model."
  - title: "An efficient algorithm for the optimal stable marriage"
    authors: ["Robert W. Irving", "Paul Leather", "Dan Gusfield"]
    id: "doi:10.1145/28869.28871"
    type: paper
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Journal of the ACM 34 (1987), 532–543; rotation-poset context. The
      development does not assume the rotation correspondence: it proves
      the distributive-lattice structure of stable matchings for the
      defined profiles and counts them as lower sets of join-irreducibles
      through Mathlib's Birkhoff representation.

